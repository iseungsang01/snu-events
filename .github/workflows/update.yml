name: Update SNU events

on:
  # 예약 실행은 뺐다. 러너에서는 www.snu.ac.kr 이 응답을 중간에 끊어 실패한다(2026-11-11).
  # 매일 갱신은 scripts/update_local.cmd 를 PC 예약 작업으로 돌린다.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-snu-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/fetch_events.py
      - name: Commit changed data
        shell: bash
        run: |
          if ! git diff --quiet -- docs/events.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/events.json
            git commit -m "chore: update SNU calendar events"
            git push
          fi
