name: Update SNU events

on:
  schedule:
    - cron: '0 21 * * *' # UTC 21:00 = 다음 날 한국 시간 06:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-snu-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/fetch_events.py
      - name: Commit changed data
        shell: bash
        run: |
          if ! git diff --quiet -- docs/events.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/events.json
            git commit -m "chore: update SNU calendar events"
            git push
          fi
